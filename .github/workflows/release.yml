name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the release files
        run: |
          for f in dist/class-numbers-zero-free-half-planes.pdf \
                   dist/class-numbers-zero-free-half-planes-tex.zip; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$TARGET" \
            --title "$TAG: Class Numbers up to Ten Thousand and Zero-Free Half-Planes" \
            --notes "Class Numbers up to Ten Thousand and Zero-Free Half-Planes, by Deep Bhattacharjee: paper (PDF), LaTeX source with figures and programs."
